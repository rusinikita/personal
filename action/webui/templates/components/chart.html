{{define "components/chart"}}
<article class="webui-chart-container">
<header>{{.Title}}</header>
<canvas id="{{.ID}}"></canvas>
<script>
(function() {
  var ctx = document.getElementById({{.ID | toJS}});
  var style = getComputedStyle(document.documentElement);
  new Chart(ctx, {
    type: {{.Type | toJS}},
    data: {
      labels: {{.Labels | toJS}},
      datasets: [{
        label: {{.SeriesName | toJS}},
        data: {{.Values | toJS}},
        borderColor: style.getPropertyValue('--webui-chart-line').trim(),
        backgroundColor: style.getPropertyValue('--webui-chart-line').trim(),
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2
    }
  });
})();
</script>
</article>
{{end}}
