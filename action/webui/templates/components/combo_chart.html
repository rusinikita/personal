{{define "components/combo_chart"}}
<article class="webui-chart-container">
<header>{{.Title}}</header>
<canvas id="{{.ID}}"></canvas>
<script>
(function() {
  var ctx = document.getElementById({{.ID | toJS}});
  var style = getComputedStyle(document.documentElement);
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: {{.Labels | toJS}},
      datasets: [
        {
          type: "bar",
          label: {{.SeriesName | toJS}},
          data: {{.Values | toJS}},
          backgroundColor: style.getPropertyValue('--webui-chart-bar').trim()
        },
        {
          type: "line",
          label: {{.SeriesName | toJS}},
          data: {{.Values | toJS}},
          borderColor: style.getPropertyValue('--webui-chart-line').trim(),
          backgroundColor: style.getPropertyValue('--webui-chart-line').trim(),
          tension: 0.25
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2,
      plugins: {
        legend: { display: false }
      }
    }
  });
})();
</script>
</article>
{{end}}
