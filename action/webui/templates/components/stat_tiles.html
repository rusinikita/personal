{{define "components/stat_tiles"}}
<div class="webui-stats">
{{range .}}<article class="webui-stat-tile{{if .Emphasis}} emphasis{{end}}">
<div class="webui-stat-label">{{.Label}}</div>
<div class="webui-stat-value">{{.Value}}</div>
{{if .SubLabel}}<div class="webui-stat-sub">{{.SubLabel}}</div>{{end}}
</article>
{{end}}</div>
{{end}}
