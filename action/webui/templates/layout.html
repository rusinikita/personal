{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --webui-accent: #0d6efd;
  --webui-stat-emphasis-bg: #e7f1ff;
  --webui-chart-grid: #dddddd;
  --webui-chart-line: #0d6efd;
  --webui-goal-over-bg: #ffe7e7;
  --webui-goal-over-border: #dc3545;
}
@media (prefers-color-scheme: dark) {
  :root {
    --webui-accent: #4dabf7;
    --webui-stat-emphasis-bg: #14315e;
    --webui-chart-grid: #444444;
    --webui-chart-line: #4dabf7;
    --webui-goal-over-bg: #4a1f1f;
    --webui-goal-over-border: #dc3545;
  }
}
nav a[aria-current="page"] { color: var(--webui-accent); font-weight: 700; }
.webui-stats { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
.webui-stat-tile { flex: 1 1 10rem; margin: 0; }
.webui-stat-tile.emphasis { background: var(--webui-stat-emphasis-bg); border: 1px solid var(--webui-accent); }
.webui-stat-label { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.03em; }
.webui-stat-value { font-size: 1.6rem; font-weight: 600; }
.webui-stat-sub { font-size: 0.8rem; opacity: 0.7; }
.webui-chart-container { max-width: 28rem; margin-bottom: 1.5rem; }
.webui-detail-back { display: inline-block; margin-bottom: 1rem; }
.webui-pagination ul { display: flex; gap: 1rem; list-style: none; padding: 0; margin: 1rem 0 0; }
.webui-pagination span[aria-disabled="true"] { opacity: 0.4; }
.webui-calendar { table-layout: fixed; }
.webui-calendar th { text-align: center; }
.webui-calendar-day { text-align: center; vertical-align: top; padding: 0.4rem; }
.webui-calendar-day-muted { opacity: 0.35; }
.webui-calendar-day-num { font-weight: 600; }
.webui-calendar-count, .webui-calendar-total { font-size: 0.75rem; opacity: 0.8; }
.webui-calendar-nav ul { display: flex; gap: 1rem; list-style: none; padding: 0; margin: 0 0 1rem; }
.webui-goal-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.webui-goal-tile { margin: 0; }
.webui-goal-tile--over { background: var(--webui-goal-over-bg); border: 1px solid var(--webui-goal-over-border); }
.webui-goal-tile-label { font-size: 0.85rem; opacity: 0.8; }
.webui-goal-tile-deadline { font-size: 0.75rem; opacity: 0.6; }
</style>
</head>
<body>
<header class="container">
<nav>
<ul><li><strong>{{.Title}}</strong></li></ul>
<ul>
{{range .Nav}}<li><a href="{{.URL}}"{{if .Active}} aria-current="page"{{end}}>{{.Label}}</a></li>
{{end}}
{{if .UserName}}<li>
<details class="dropdown">
<summary>{{.UserName}}</summary>
<ul dir="rtl">
<li><a href="/web/logout">Logout</a></li>
</ul>
</details>
</li>{{end}}
</ul>
</nav>
</header>
<main class="container">
{{.Content}}
</main>
</body>
</html>
{{end}}
